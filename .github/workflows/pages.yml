name: Sync FM2 and deploy Prime OS

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync latest FM2 data from NeonSportz
        run: node scripts/sync-neon.mjs

      - name: Freeze Season 1 snapshot
        run: node scripts/freeze-season1.mjs

      - name: Commit Season 1 snapshot if newly frozen
        run: |
          if git status --porcelain data/season1.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/season1.json
            git commit -m "Freeze FM2 Season 1 snapshot"
            git push
          else
            echo "Season 1 snapshot already frozen."
          fi

      - name: Validate Prime OS
        run: |
          node --check os.js
          test -s index.html
          test -s os.css
          test -s wrapped.css
          test -s data/fm2-data.json
          test -s data/season1.json

      - name: Build Prime OS artifact
        run: |
          rm -rf dist
          mkdir -p dist/data
          cp index.html dist/index.html
          cp os.css dist/os.css
          cp wrapped.css dist/wrapped.css
          cp os.js dist/os.js
          cp data/fm2-data.json dist/data/fm2-data.json
          cp data/season1.json dist/data/season1.json
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

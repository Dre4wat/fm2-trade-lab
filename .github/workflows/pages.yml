name: Sync FM2 and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync latest FM2 roster from NeonSportz
        run: node scripts/sync-neon.mjs

      - name: Build static site artifact
        run: |
          rm -rf dist
          mkdir -p dist/data
          curl -fsSL https://dre4wat.github.io/fm2-trade-lab/index.html -o dist/index.html
          curl -fsSL https://dre4wat.github.io/fm2-trade-lab/styles.css -o dist/styles.css
          curl -fsSL https://dre4wat.github.io/fm2-trade-lab/app.js -o dist/app.js
          cp profiles.js dist/profiles.js
          cp profiles.css dist/profiles.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/index.html')
          s=p.read_text()
          if 'profiles.css' not in s:
              s=s.replace('</head>','  <link rel="stylesheet" href="./profiles.css" />\n</head>')
          if 'profiles.js' not in s:
              s=s.replace('</body>','  <script src="./profiles.js" defer></script>\n</body>')
          p.write_text(s)
          PY
          cp data/fm2-data.json dist/data/fm2-data.json
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

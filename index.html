<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#06080c" />
  <meta name="description" content="FM2 Prime OS — a live operating system for the FM2 Madden franchise." />
  <title>FM2 // PRIME OS</title>
  <link rel="stylesheet" href="./os.css" />
  <link rel="stylesheet" href="./wrapped.css" />
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-mark">
      <span>FM2</span>
      <b>PRIME OS</b>
    </div>
    <div class="boot-line"><i></i></div>
    <div id="bootText" class="boot-text">Initializing franchise kernel…</div>
  </div>

  <div class="wallpaper">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="scan-grid"></div>
    <div class="noise"></div>
  </div>

  <div id="os" class="os-shell is-loading">
    <header class="menubar">
      <button class="brand-orb" data-app="home" aria-label="FM2 Home">F</button>
      <div class="brand-copy">
        <b>FM2 // PRIME</b>
        <span id="seasonLabel">LIVE FRANCHISE OPERATING SYSTEM</span>
      </div>
      <div class="menubar-center">
        <button id="spotlightBtn" class="spotlight-trigger">
          <span class="search-glyph">⌕</span>
          <span>Search FM2</span>
          <kbd>⌘ K</kbd>
        </button>
      </div>
      <div class="system-status">
        <span class="pulse-dot"></span>
        <span id="syncStatus">SYNCING</span>
        <span id="clock">--:--</span>
        <button id="controlBtn" class="system-btn" title="Control Center">◫</button>
      </div>
    </header>

    <aside class="rail">
      <button class="rail-item active" data-app="home"><span>⌂</span><small>HOME</small></button>
      <button class="rail-item" data-app="teams"><span>32</span><small>TEAMS</small></button>
      <button class="rail-item" data-app="players"><span>◎</span><small>PLAYERS</small></button>
      <button class="rail-item" data-app="standings"><span>≋</span><small>TABLE</small></button>
      <button class="rail-item" data-app="schedule"><span>▦</span><small>GAMES</small></button>
      <button class="rail-item" data-app="wrapped"><span>✺</span><small>WRAPPED</small></button>
      <button class="rail-item" data-app="contracts"><span>$</span><small>CAP</small></button>
      <button class="rail-item" data-app="compare"><span>⇄</span><small>COMPARE</small></button>
      <button class="rail-item" data-app="trade"><span>⇌</span><small>TRADE</small></button>
      <button class="rail-item" data-app="lab"><span>✦</span><small>LAB</small></button>
    </aside>

    <main class="workspace">
      <div class="workspace-topline">
        <div>
          <span class="eyebrow">ACTIVE SPACE</span>
          <h1 id="spaceTitle">Command Center</h1>
        </div>
        <div class="workspace-actions">
          <button id="missionBtn" class="ghost-btn">Mission Control</button>
          <button id="refreshBtn" class="ghost-btn">Sync Data</button>
        </div>
      </div>
      <section id="desktop" class="desktop"></section>
    </main>

    <nav class="dock" aria-label="Applications">
      <button data-app="home" class="dock-app active"><span>⌂</span><small>Command</small></button>
      <button data-app="teams" class="dock-app"><span>32</span><small>Franchises</small></button>
      <button data-app="players" class="dock-app"><span>◎</span><small>Matrix</small></button>
      <button data-app="standings" class="dock-app"><span>≋</span><small>Standings</small></button>
      <button data-app="schedule" class="dock-app"><span>▦</span><small>Schedule</small></button>
      <button data-app="wrapped" class="dock-app"><span>✺</span><small>Wrapped</small></button>
      <button data-app="trade" class="dock-app accent"><span>⇌</span><small>Trade Lab</small></button>
    </nav>

    <div id="spotlight" class="spotlight hidden" aria-hidden="true">
      <div class="spotlight-backdrop" data-close="spotlight"></div>
      <div class="spotlight-box">
        <div class="spotlight-head">
          <span>⌕</span>
          <input id="spotlightInput" autocomplete="off" placeholder="Search a player, team, app, position…" />
          <kbd>ESC</kbd>
        </div>
        <div id="spotlightResults" class="spotlight-results"></div>
      </div>
    </div>

    <div id="controlCenter" class="control-center hidden">
      <div class="control-card">
        <div class="control-head">
          <div><span class="eyebrow">SYSTEM</span><h3>Control Center</h3></div>
          <button class="icon-btn" data-close="control">×</button>
        </div>
        <div class="control-grid">
          <button class="control-tile active" id="motionToggle"><b>◉</b><span>Motion</span><small>Ambient UI</small></button>
          <button class="control-tile" id="compactToggle"><b>▤</b><span>Dense Mode</span><small>More data</small></button>
          <button class="control-tile" id="focusToggle"><b>◐</b><span>Focus</span><small>Dim wallpaper</small></button>
          <button class="control-tile" id="randomTeamBtn"><b>⌘</b><span>Warp Team</span><small>Random HQ</small></button>
        </div>
        <div class="system-readout">
          <div><span>DATA KERNEL</span><b id="kernelStatus">CONNECTING</b></div>
          <div><span>PLAYERS</span><b id="kernelPlayers">—</b></div>
          <div><span>GAMES</span><b id="kernelGames">—</b></div>
          <div><span>LAST SYNC</span><b id="kernelSync">—</b></div>
        </div>
      </div>
    </div>

    <div id="missionControl" class="mission hidden">
      <div class="mission-backdrop" data-close="mission"></div>
      <div class="mission-panel">
        <div class="mission-head">
          <div><span class="eyebrow">FM2 // PRIME</span><h2>Mission Control</h2></div>
          <button class="icon-btn" data-close="mission">×</button>
        </div>
        <div id="missionApps" class="mission-apps"></div>
      </div>
    </div>

    <div id="toastStack" class="toast-stack"></div>
  </div>

  <script src="./os.js" defer></script>
</body>
</html>
